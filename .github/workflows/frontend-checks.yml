name: Frontend checks

on:
  pull_request:
  push:
    branches: [main, refactor/frontend-consolidation]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build:prod
      - uses: actions/upload-artifact@v4
        with:
          name: idmp-frontend-${{ github.sha }}
          path: dist/
          retention-days: 7
